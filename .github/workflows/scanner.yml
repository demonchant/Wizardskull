          name: WizardSkull Elite Signal Engine

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      force_scan:
        description: "Force scan regardless of regime"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  push:
    branches:
      - main
    paths:
      - "wizardskull_scanner.py"
      - ".github/workflows/scanner.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: wizardskull-scan
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════
  # JOB 1 — SIGNAL SCAN
  # ═══════════════════════════════════════════════════════════
  signal-scan:
    name: "⚡ Signal Scan — SCHEDULED"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET:     ${{ secrets.BINANCE_SECRET }}
      FORCE_SCAN:         ${{ github.event.inputs.force_scan || 'false' }}
      PYTHONUNBUFFERED:   "1"

    outputs:
      signals_fired: ${{ steps.scanner.outputs.signals_fired }}
      regime:        ${{ steps.scanner.outputs.regime }}
      files_exist:   ${{ steps.check_files.outputs.files_exist }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ─────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Restore cached state (graceful — ok if missing) ──
      - name: "♻️ Restore signal state"
        uses: actions/cache/restore@v4
        with:
          path: |
            signals.json
            trade_log.csv
            sent_hashes.json
          key: wizardskull-state-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            wizardskull-state-${{ runner.os }}-
            wizardskull-state-
        continue-on-error: true

      # ── 4. Initialise empty state files if missing ───────
      - name: "🗂️ Initialise state files"
        run: |
          [ -f signals.json ]    || echo "[]"  > signals.json
          [ -f sent_hashes.json ]|| echo "{}"  > sent_hashes.json
          [ -f trade_log.csv ]   || echo "timestamp,asset,direction,entry,tp1,tp2,tp3,sl,liq,rr,score,regime,hash,funding_rate,oi_delta,long_liq,short_liq" > trade_log.csv
          echo "✅ State files ready"
          echo "  signals.json    : $(wc -c < signals.json) bytes"
          echo "  trade_log.csv   : $(wc -l < trade_log.csv) rows"
          echo "  sent_hashes.json: $(wc -c < sent_hashes.json) bytes"

      # ── 5. Scan metadata ─────────────────────────────────
      - name: "ℹ️ Scan metadata"
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  WizardSkull Elite Signal Engine"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Time    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Trigger : ${{ github.event_name }}"
          echo "  Runner  : ubuntu-22.04"
          echo "  Python  : $(python --version 2>&1)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 6. Run scanner ───────────────────────────────────
      - name: "🔍 Run signal scanner"
        id: scanner
        run: |
          python wizardskull_scanner.py 2>&1 | tee scan_output.log

          # Parse outputs for downstream jobs
          FIRED=$(python -c "
          import json
          try:
            d = json.load(open('signals.json'))
            sent = [s for s in d if s.get('telegram_sent')]
            print(len(sent))
          except:
            print(0)
          " 2>/dev/null || echo "0")

          REGIME=$(grep -oP '(?<=BTC Regime: )\w+' scan_output.log | tail -1 || echo "UNKNOWN")

          echo "signals_fired=$FIRED" >> $GITHUB_OUTPUT
          echo "regime=$REGIME"       >> $GITHUB_OUTPUT
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Signals fired : $FIRED"
          echo "  BTC Regime    : $REGIME"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── 7. Check files exist before upload ───────────────
      - name: "🔎 Check output files"
        id: check_files
        if: always()
        run: |
          EXISTS="false"
          if [ -s signals.json ] && [ -s trade_log.csv ]; then
            EXISTS="true"
          fi
          echo "files_exist=$EXISTS" >> $GITHUB_OUTPUT
          echo "Files check:"
          ls -lh signals.json trade_log.csv sent_hashes.json scan_output.log 2>/dev/null || true

      # ── 8. Upload artifacts (only if files exist) ────────
      - name: "📊 Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizardskull-signals-${{ github.run_number }}
          path: |
            signals.json
            trade_log.csv
            sent_hashes.json
            scan_output.log
          if-no-files-found: warn
          retention-days: 90

      # ── 9. Save cache ────────────────────────────────────
      - name: "💾 Save state cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            signals.json
            trade_log.csv
            sent_hashes.json
          key: wizardskull-state-${{ runner.os }}-${{ github.run_number }}
        continue-on-error: true

      # ── 10. Commit logs back to repo ─────────────────────
      - name: "📝 Commit signal logs"
        if: always()
        run: |
          git config user.name  "WizardSkull Bot"
          git config user.email "wizardskull-bot@users.noreply.github.com"

          git add -f signals.json     2>/dev/null || true
          git add -f trade_log.csv    2>/dev/null || true
          git add -f sent_hashes.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit (no new signals)"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "📊 Signal scan — $TIMESTAMP [skip ci]"
            git push
            echo "✅ Logs committed to repo"
          fi

      # ── 11. Telegram heartbeat — ALWAYS sent ─────────────
      - name: "💓 Telegram heartbeat"
        if: always()
        env:
          SCAN_RESULT: ${{ job.status }}
        run: |
          FIRED="${{ steps.scanner.outputs.signals_fired || '0' }}"
          REGIME="${{ steps.scanner.outputs.regime || 'UNKNOWN' }}"
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$SCAN_RESULT" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Online"
          else
            STATUS_ICON="⚠️"
            STATUS_TEXT="Scan job ended with status: ${SCAN_RESULT}"
          fi

          if [ "$FIRED" -gt 0 ] 2>/dev/null; then
            SIGNAL_LINE="🔔 ${FIRED} signal(s) fired this run"
          else
            SIGNAL_LINE="😴 No signals this run — scanning continues"
          fi

          MESSAGE="${STATUS_ICON} *WizardSkull Scanner Heartbeat*

🕒 ${TS}
⚙️ Status: ${STATUS_TEXT}
📈 BTC Regime: ${REGIME}
${SIGNAL_LINE}
🔁 Next scan: ~4h
🔗 [Run details](${RUN_URL})"

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" \
              --data-urlencode text="${MESSAGE}" \
              -o telegram_heartbeat_response.json

            echo "Telegram heartbeat response:"
            cat telegram_heartbeat_response.json || true
          else
            echo "⚠️ TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — heartbeat skipped"
          fi

      # ── 12. Job summary ──────────────────────────────────
      - name: "📋 Write job summary"
        if: always()
        run: |
          FIRED="${{ steps.scanner.outputs.signals_fired || '0' }}"
          REGIME="${{ steps.scanner.outputs.regime || 'UNKNOWN' }}"
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ⚡ WizardSkull Scan Summary

          | Field | Value |
          |-------|-------|
          | Timestamp | $TS |
          | Trigger | ${{ github.event_name }} |
          | BTC Regime | $REGIME |
          | Signals Fired | $FIRED |
          | Score Threshold | 7/10 |
          | Telegram Heartbeat | ✅ Sent |

          ### Assets Monitored
          \`XRP/USDT\` · \`ETH/USDT\` · \`SOL/USDT\` · \`TON/USDT\`

          ### Indicators Active
          KDJ (3D·1D·4H) · MACD · EMA21/50 · Volume · Funding Rate · OI · Liquidations · L/S Ratio

          ### What "0 signals" means
          The scanner ran successfully. No asset reached 7/10 this cycle.
          This is **normal** — the system only fires on high-confidence setups.
          Check back at the next scheduled run (every 4 hours).

          ### What the heartbeat means
          A Telegram message is sent on **every** run — signal or not —
          so you always know the scanner executed and is alive.
          SUMMARY

          # Print scan log to console for visibility
          echo ""
          echo "══ SCAN OUTPUT LOG ══════════════════════"
          cat scan_output.log 2>/dev/null || echo "(no log)"
          echo "════════════════════════════════════════"


  # ═══════════════════════════════════════════════════════════
  # JOB 2 — HEALTH CHECK
  # ═══════════════════════════════════════════════════════════
  health-check:
    name: "❤️ System Health Check"
    runs-on: ubuntu-22.04
    needs: signal-scan
    if: always()
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐍 Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Download artifacts — graceful if scan had no signals
      - name: "📥 Download scan artifacts"
        uses: actions/download-artifact@v4
        with:
          name: wizardskull-signals-${{ github.run_number }}
        continue-on-error: true

      # Health report — works even with no data
      - name: "❤️ Health report"
        env:
          SCAN_STATUS:    ${{ needs.signal-scan.result }}
          SIGNALS_FIRED:  ${{ needs.signal-scan.outputs.signals_fired || '0' }}
          REGIME:         ${{ needs.signal-scan.outputs.regime || 'UNKNOWN' }}
        run: |
          python3 - << 'PYEOF'
          import os, json, csv
          from datetime import datetime, timezone

          RESET  = "\033[0m"
          GREEN  = "\033[92m"
          YELLOW = "\033[93m"
          RED    = "\033[91m"
          CYAN   = "\033[96m"

          def ok(msg):  print(f"  {GREEN}✅{RESET} {msg}")
          def warn(msg):print(f"  {YELLOW}⚠️ {RESET} {msg}")
          def err(msg): print(f"  {RED}❌{RESET} {msg}")
          def info(msg):print(f"  {CYAN}ℹ️ {RESET} {msg}")

          print()
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("  WizardSkull — System Health Report")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")

          scan_status   = os.environ.get("SCAN_STATUS",   "unknown")
          signals_fired = os.environ.get("SIGNALS_FIRED", "0")
          regime        = os.environ.get("REGIME",        "UNKNOWN")
          ts            = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')

          print(f"  Time        : {ts}")
          print(f"  Scan job    : {scan_status.upper()}")
          print(f"  BTC Regime  : {regime}")
          print(f"  Signals     : {signals_fired}")
          print()

          # Scan job status
          if scan_status == "success":
            ok("Signal scan completed successfully")
          else:
            warn(f"Signal scan ended with status: {scan_status}")

          # signals.json
          if os.path.exists("signals.json"):
            try:
              with open("signals.json") as f:
                sigs = json.load(f)
              ok(f"signals.json found — {len(sigs)} total signals stored")
              if sigs:
                last = sigs[-1]
                info(f"Last signal: {last.get('asset','?')} "
                     f"{last.get('bias','?').upper()} "
                     f"score={last.get('score','?')}/10 "
                     f"@ {str(last.get('timestamp',''))[:16]}")
            except Exception as e:
              warn(f"signals.json exists but could not parse: {e}")
          else:
            info("signals.json not found — no signals fired yet (normal on first run)")

          # trade_log.csv
          if os.path.exists("trade_log.csv"):
            try:
              with open("trade_log.csv") as f:
                rows = list(csv.DictReader(f))
              ok(f"trade_log.csv found — {len(rows)} trade rows")
            except Exception as e:
              warn(f"trade_log.csv parse error: {e}")
          else:
            info("trade_log.csv not found — will be created when first signal fires")

          # sent_hashes.json
          if os.path.exists("sent_hashes.json"):
            try:
              with open("sent_hashes.json") as f:
                hashes = json.load(f)
              ok(f"Dedup cache active — {len(hashes)} hashes stored")
            except Exception as e:
              warn(f"sent_hashes.json parse error: {e}")
          else:
            info("sent_hashes.json not found — dedup cache will init on first signal")

          # scan_output.log
          if os.path.exists("scan_output.log"):
            ok("scan_output.log available for review")
            with open("scan_output.log") as f:
              lines = f.readlines()
            print()
            print("  ── Last 20 lines of scan output ──")
            for line in lines[-20:]:
              print("  " + line.rstrip())
          else:
            warn("scan_output.log missing")

          print()
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")

          # Regime explanation
          if regime == "SIDEWAYS":
            warn("BTC is SIDEWAYS — all entries blocked. No signals expected.")
            info("This is correct behaviour. Wait for BTC to trend.")
          elif regime == "BULLISH":
            ok("BTC BULLISH — LONG signals enabled for XRP ETH SOL TON")
          elif regime == "BEARISH":
            ok("BTC BEARISH — SHORT signals enabled for XRP ETH SOL TON")
          else:
            info("Regime unknown — check scan log above")

          print()
          ok("Health check complete")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          PYEOF

      # Health summary card
      - name: "📋 Health summary"
        if: always()
        run: |
          REGIME="${{ needs.signal-scan.outputs.regime || 'UNKNOWN' }}"
          FIRED="${{ needs.signal-scan.outputs.signals_fired || '0' }}"
          STATUS="${{ needs.signal-scan.result }}"

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## ❤️ System Health

          | Check | Status |
          |-------|--------|
          | Signal scan | $STATUS |
          | BTC regime | $REGIME |
          | Signals this run | $FIRED |
          | Scanner | ✅ Running |
          | Telegram heartbeat | ✅ Sent every run |
          | Schedule | Every 4 hours |

          ### Telegram Setup
          Make sure these secrets are set in **Settings → Secrets → Actions**:
          - \`TELEGRAM_BOT_TOKEN\` — from @BotFather
          - \`TELEGRAM_CHAT_ID\` — your chat ID

          ### ℹ️ 0 signals is normal
          The engine only fires when 7 of 10 conditions align simultaneously.
          If BTC is SIDEWAYS all entries are blocked by the regime filter.

          ### 💓 Heartbeat
          A separate Telegram heartbeat message is sent on every run
          (regardless of signals) so you always know the system is alive.
          SUMMARY
          
