name: WizardSkull Futures Scanner (Smart 4H Trigger)

on:
  schedule:
    # Runs at 5 minutes past every 4th hour (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
    # This is exactly when the 4H candle closes and the signal is confirmed.
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
